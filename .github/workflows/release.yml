name: Build and publish wheels

run-name: Build ${{ github.event.release.tag_name || github.ref_name }}

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify package version
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]

          tag = os.environ.get("RELEASE_TAG")
          if tag:
              prefix = "pylibpag-v"
              if not tag.startswith(prefix):
                  raise SystemExit(f"Release tag must start with {prefix!r}: {tag!r}")
              if tag.removeprefix(prefix) != version:
                  raise SystemExit(
                      f"Release tag {tag!r} does not match project version {version!r}"
                  )

          print(f"Building pylibpag {version}")
          PY

  build-linux:
    name: Build Linux ${{ matrix.architecture }} wheel
    needs: verify
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/pypa/${{ matrix.manylinux_platform }}:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-26.04
            manylinux_platform: manylinux_2_28_x86_64
          - architecture: arm64
            runner: ubuntu-26.04-arm
            manylinux_platform: manylinux_2_28_aarch64
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build wheel
        run: |
          npm install --global depsync@1.4.6

          # The .git directory can cause ownership errors and an unnecessary LFS sync during depsync
          rm -rf .git
          depsync

          build_python=/opt/python/cp314-cp314t/bin/python
          "${build_python}" -m pip install \
              --disable-pip-version-check \
              --root-user-action ignore \
              build==1.6.1 \
              auditwheel==6.8.2
          "${build_python}" -m build --wheel --outdir wheelhouse
          "${build_python}" -m auditwheel repair \
              --plat "${{ matrix.manylinux_platform }}" \
              --wheel-dir dist \
              wheelhouse/*.whl

      - name: Test with CPython 3.14
        run: |
          /opt/python/cp314-cp314/bin/python -m venv "${RUNNER_TEMP}/test-cp314"
          "${RUNNER_TEMP}/test-cp314/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-deps \
              dist/*.whl
          "${RUNNER_TEMP}/test-cp314/bin/python" -m unittest discover \
              --start-directory python/tests \
              --verbose

      - name: Test with CPython 3.14t
        run: |
          /opt/python/cp314-cp314t/bin/python -m venv "${RUNNER_TEMP}/test-cp314t"
          "${RUNNER_TEMP}/test-cp314t/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-deps \
              dist/*.whl
          "${RUNNER_TEMP}/test-cp314t/bin/python" -m unittest discover \
              --start-directory python/tests \
              --verbose
          "${RUNNER_TEMP}/test-cp314t/bin/python" -c \
              'import sysconfig; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1'

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions-linux-${{ matrix.architecture }}
          path: dist/*.whl
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64 wheel
    needs: verify
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up CPython 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          npm install --global depsync@1.4.6

          # The .git directory can cause ownership errors and an unnecessary LFS sync during depsync
          rm -rf .git
          depsync

          python -m pip install \
              --disable-pip-version-check \
              build==1.6.1 \
              delocate==0.13.0
          python -m build --wheel --outdir wheelhouse
          delocate-wheel \
              --require-archs=arm64 \
              --wheel-dir dist \
              wheelhouse/*.whl

      - name: Test with CPython 3.14
        run: |
          python -m venv "${RUNNER_TEMP}/test-cp314"
          "${RUNNER_TEMP}/test-cp314/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-deps \
              dist/*.whl
          "${RUNNER_TEMP}/test-cp314/bin/python" -m unittest discover \
              --start-directory python/tests \
              --verbose

      - name: Set up CPython 3.14t
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"

      - name: Test with CPython 3.14t
        run: |
          python -m venv "${RUNNER_TEMP}/test-cp314t"
          "${RUNNER_TEMP}/test-cp314t/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-deps \
              dist/*.whl
          "${RUNNER_TEMP}/test-cp314t/bin/python" -m unittest discover \
              --start-directory python/tests \
              --verbose
          "${RUNNER_TEMP}/test-cp314t/bin/python" -c \
              'import sysconfig; assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1'

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions-macos-arm64
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheels
    if: github.event_name == 'release'
    needs: [ build-linux, build-macos ]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/pylibpag/
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-package-distributions-*
          path: dist
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
