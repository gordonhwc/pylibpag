name: Publish to PyPI

run-name: Publish ${{ github.event.release.tag_name }} to PyPI

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          prefix = "pylibpag-v"
          if not tag.startswith(prefix):
              raise SystemExit(f"Release tag must start with {prefix!r}: {tag!r}")

          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]

          if tag.removeprefix(prefix) != version:
              raise SystemExit(
                  f"Release tag {tag!r} does not match project version {version!r}"
              )
          PY

      - name: Build and test wheel
        run: python3 scripts/build_wheel.py

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheel
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pylibpag/
    permissions:
      id-token: write

    steps:
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish wheel to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
